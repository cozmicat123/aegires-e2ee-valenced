# AI-written glue. Fails if a vendored Aegires file differs from the pinned commit (other than its package line).
name: Verify vendored

on:
  push:
    branches: [valenced-port]
  workflow_dispatch:

jobs:
  vendored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/verify-vendored.sh
